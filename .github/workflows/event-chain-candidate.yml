name: Event chain candidate quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-quality:
    name: event-chain candidate lint + strict types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r event_chain_gate_requirements.txt
      - run: python scripts/event_chain_gate.py
  python39-floor:
    name: event-chain candidate Python 3.9 tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.9'
      - run: python -m pip install -r event_chain_gate_requirements.txt
      - run: python -m pytest -q tests/test_event_chain_candidate.py tests/test_event_chain_storage.py
