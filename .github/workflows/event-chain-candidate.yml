name: Event chain candidate quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-quality:
    name: event-chain candidate lint + strict types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r event_chain_gate_requirements.txt
      - run: python scripts/event_chain_gate.py
  python39-floor:
    name: event-chain candidate Python 3.9 tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9'
      - run: python -m pip install -r event_chain_gate_requirements.txt
      - run: python -m pytest -q tests/test_event_chain_candidate.py
