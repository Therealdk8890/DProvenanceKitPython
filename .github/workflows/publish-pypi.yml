name: Publish to PyPI

# Publishes the library when a GitHub Release is published. Uses PyPI Trusted Publishing
# (OIDC) — no API token stored in the repo. One-time setup on PyPI: add a trusted publisher
# for project "dprovenancekit" → owner/repo, workflow "publish-pypi.yml", environment "pypi".
on:
  release:
    types: [published]

jobs:
  # Gate the release on a green test suite. A GitHub Release can be cut from any commit,
  # including one that never passed CI; without this gate a broken build would ship to PyPI.
  # The publish job `needs:` this job, so a single failing test blocks publication entirely.
  test:
    name: pytest (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -rs

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # required for trusted publishing and Sigstore signing
      attestations: write  # required to store GitHub artifact attestations
      contents: read       # explicit: a permissions block resets unlisted scopes to none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      # SLSA build provenance for every artifact, verifiable with
      # `gh attestation verify <file> --repo Therealdk8890/DProvenanceKitPython`.
      # Separate from the PEP 740 attestations that gh-action-pypi-publish
      # uploads to PyPI by default under trusted publishing.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
