name: Publish to PyPI

# Publishes the library when a GitHub Release is published. Uses PyPI Trusted Publishing
# (OIDC) — no API token stored in the repo. One-time setup on PyPI: add a trusted publisher
# for project "dprovenancekit" → owner/repo, workflow "publish-pypi.yml", environment "pypi".
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Gate the release on a green test suite. A GitHub Release can be cut from any commit,
  # including one that never passed CI; without this gate a broken build would ship to PyPI.
  # The publish job `needs:` this job, so a single failing test blocks publication entirely.
  test:
    name: pytest (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -rs

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # required for trusted publishing and Sigstore signing
      attestations: write  # required to store GitHub artifact attestations
      contents: read       # explicit: a permissions block resets unlisted scopes to none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release_version.py "$RELEASE_TAG"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      # SLSA build provenance for every artifact, verifiable with
      # `gh attestation verify <file> --repo Therealdk8890/DProvenanceKitPython`.
      # Separate from the PEP 740 attestations that gh-action-pypi-publish
      # uploads to PyPI by default under trusted publishing.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
