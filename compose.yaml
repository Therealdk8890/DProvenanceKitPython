services:
  dpk-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: dprovenancekit-viewer:local
    command:
      - ui
      - --source
      - primary=Traces=/traces/traces.sqlite
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --allow-host
      - localhost
      - --allow-host
      - 127.0.0.1
      - --allow-host
      - "::1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./traces:/traces:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    init: true
    restart: unless-stopped
