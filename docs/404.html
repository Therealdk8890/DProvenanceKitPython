<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — DProvenanceKit</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#08090b; --bg2:#0d0f13; --bg3:#101318;
    --border:#21262e; --border2:#2b323c;
    --text:#c9d1d9; --dim:#8f99a3; --faint:#7d8590;
    --red:#f85149; --red-bg:rgba(248,81,73,.10);
    --green:#3fb950; --green-hi:#56d364;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--mono);
    font-size:15px;line-height:1.65;min-height:100vh;
    display:flex;flex-direction:column;
    background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(63,185,80,.05),transparent);
  }
  a{color:var(--green-hi);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:940px;margin:0 auto;padding:0 20px;width:100%}
  header{border-bottom:1px solid var(--border);background:rgba(8,9,11,.92)}
  .nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 0}
  .logo{color:var(--text);font-weight:700;letter-spacing:-.02em}
  .logo:hover{text-decoration:none}
  .logo .p{color:var(--green)}
  main{flex:1;display:flex;align-items:center;padding:56px 0}
  .term{border:1px solid var(--border);border-radius:10px;background:#0b0d10;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .term-bar{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg2)}
  .dot{width:11px;height:11px;border-radius:50%;background:#333a43}
  .dot.r{background:#71332f}.dot.y{background:#6b5a26}.dot.g{background:#2c5237}
  .term-title{margin:0 auto;font-size:12px;color:var(--faint)}
  .term-body{padding:18px 18px 20px;font-size:13px;line-height:1.7;overflow-x:auto;white-space:pre;font-family:var(--mono)}
  .t-dollar{color:var(--faint)}
  .t-cmd{color:var(--text)}
  .t-dim{color:var(--dim)}
  .t-red{color:var(--red);font-weight:700}
  .t-failband{display:inline-block;background:var(--red-bg);border-left:3px solid var(--red);padding:1px 10px 1px 8px;margin-left:-11px}
  .links{font-family:var(--sans);color:var(--dim);font-size:14.5px;margin-top:22px}
  @media (max-width:480px){.term-body{font-size:11.5px}}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="https://dprovenance.dev/"><span class="p">$</span> dprovenancekit</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="term" role="img" aria-label="404: this page was never recorded.">
      <div class="term-bar" aria-hidden="true">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="term-title">dprovenance.dev · 404</span>
      </div>
      <pre class="term-body" aria-hidden="true"><span class="t-dollar">$</span> <span class="t-cmd">dprovenancekit runs --db traces.sqlite --context "$REQUESTED_PATH"</span>
<span class="t-dim">No runs found.</span>

<span class="t-failband"><span class="t-dim">HTTP </span><span class="t-red">404</span></span>
<span class="t-dim">  this page was never recorded.</span></pre>
    </div>
    <p class="links">
      Try the <a href="https://dprovenance.dev/">homepage</a>,
      the <a href="https://dprovenance.dev/guides/regression-testing-for-ai-agents/">regression-testing guide</a>,
      the <a href="https://dprovenance.dev/guides/ci-gate-for-llm-agents/">CI-gate guide</a>,
      or the <a href="https://github.com/Therealdk8890/DProvenanceKitPython">GitHub repo</a>.
    </p>
  </div>
</main>

</body>
</html>
